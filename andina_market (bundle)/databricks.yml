# This is a Declarative Automation Bundle definition for andina_market.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: andina_market
  uuid: 1886135d-20e6-47c6-85c0-71c35907d852

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-c7734eac-73e7.cloud.databricks.com
    variables:
      catalog: andina_market
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-c7734eac-73e7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/cornachofrance@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/cornachofrance@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: andina_market
      schema: prod
    permissions:
      - user_name: cornachofrance@gmail.com
        level: CAN_MANAGE
