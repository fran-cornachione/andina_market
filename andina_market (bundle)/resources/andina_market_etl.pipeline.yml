# The main pipeline for andina_market

resources:
  pipelines:
    andina_market_etl:
      name: andina_market_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/andina_market_etl"

      libraries:
        - glob:
            include: ../src/andina_market_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
