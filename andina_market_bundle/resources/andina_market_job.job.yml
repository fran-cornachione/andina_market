resources:
  jobs:
    andina_market_job:
      name: andina_market_job
      email_notifications:
        on_failure:
          - data_analyst@andinamarket.com
          - data_engineer@andinamarket.com
          - data_scientist@andinamarket.com
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: run_etl_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.andina_market_etl.id}
        - task_key: refresh_powerbi_dashboard
          depends_on:
            - task_key: run_etl_pipeline
          power_bi_task:
            tables:
              - name: dim_customer
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
              - name: dim_customer_current
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
              - name: dim_date
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
              - name: dim_product
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
              - name: fact_orders
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
              - name: fact_payments
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
              - name: fact_support_tickets
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
              - name: customer_segment_changes
                catalog: andina_market
                schema: gold
                storage_mode: IMPORT
            warehouse_id: f55c1d5853ef79e0
            power_bi_model:
              workspace_name: andina_market
              model_name: andina_market_semantic_model
              storage_mode: IMPORT
              authentication_method: PAT
              overwrite_existing: false
            connection_resource_name: andina_market_powerbi
            refresh_after_update: true
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED