# Declarative Automation Bundle definition for andina_market.
bundle:
  name: andina_market
  uuid: 1886135d-20e6-47c6-85c0-71c35907d852

include:
  - resources/*.yml
  - src/*.yml

variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: andina_market
      schema: dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: andina_market
      schema: prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE